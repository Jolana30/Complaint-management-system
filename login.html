<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ambo CMS">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <title>Login - Ambo University CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/nav.css">
  <style>
    .login-wrapper {
      max-width: 440px;
      margin: 40px auto;
    }
    .demo-accounts {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed var(--border-color);
      text-align: center;
    }
    .demo-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .demo-buttons button {
      flex: 1 1 120px;
      font-size: 0.82rem;
      padding: 8px 10px;
    }
    .pwd-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .pwd-wrapper input {
      width: 100%;
      padding-right: 44px;
    }
    .pwd-toggle-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease, background-color 0.15s ease;
      line-height: 1;
    }
    .pwd-toggle-btn:hover {
      color: var(--primary);
      background-color: var(--surface-hover);
    }
    .pwd-toggle-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }
  </style>
</head>
<body>

  <nav class="main-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        <img src="assets/images/logo.png" alt="Ambo University Logo">
        <div class="brand-info">
          <span class="brand-title">Ambo University</span>
          <span class="brand-subtitle">Complaint Management System</span>
        </div>
      </a>
      <ul class="nav-menu" id="navLinks"></ul>
      <div class="nav-actions">
        <button class="theme-toggle-btn" aria-label="Toggle theme"><svg class="theme-switch-svg light" width="46" height="24" viewBox="0 0 46 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="0.5" y="0.5" width="45" height="23" rx="11.5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><path d="M34.5 7.5a4.5 4.5 0 0 0 4.2 4.2 5 5 0 1 1-4.2-4.2z" fill="#94a3b8" opacity="0.45"/><circle cx="38" cy="8.5" r="0.8" fill="#94a3b8" opacity="0.45"/><g filter="drop-shadow(0 2px 4px rgba(0,0,0,0.18))"><circle cx="12" cy="12" r="9.5" fill="#ffffff" /><circle cx="12" cy="12" r="4.2" fill="#f59e0b" /><path d="M12 4.8v1.4M12 17.8v1.4M4.8 12h1.4M17.8 12h1.4M6.9 6.9l1 1M16.1 16.1l1 1M6.9 17.1l1-1M16.1 7.9l1-1" stroke="#f59e0b" stroke-width="1.3" stroke-linecap="round"/></g></svg></button>
        <div id="navUserBadge"></div>
        <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="container">
      <div class="login-wrapper">
        <div class="card" style="padding: 32px 28px;">
          <div style="text-align: center; margin-bottom: 24px;">
            <img src="assets/images/logo.png" alt="Ambo University" style="width: 64px; height: 64px; border-radius: 12px; margin-bottom: 12px; box-shadow: var(--shadow-sm);">
            <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 4px;">Sign in to CMS</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Select your institutional role to continue</p>
          </div>

          <form id="loginForm">
            <div class="form-group">
              <label for="username">Username or ID <span class="required">*</span></label>
              <input type="text" id="username" name="username" placeholder="e.g. jdoe or ugr/12345/16" required>
            </div>

            <div class="form-group">
              <label for="password">Password <span class="required">*</span></label>
              <div class="pwd-wrapper">
                <input type="password" id="password" name="password" placeholder="Enter password" required>
                <button type="button" class="pwd-toggle-btn" id="pwdToggle" aria-label="Show password" title="Toggle password visibility"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
              </div>
            </div>

            <div class="form-group">
              <label for="userRole">Login as Role <span class="required">*</span></label>
              <select id="userRole" name="role" required>
                <option value="" disabled selected>-- Select statutory role --</option>
                <option value="student">Student (Abebe Kebede - ugr/12345/16)</option>
                <option value="teacher">Teacher / Faculty (Mr. Eyuel)</option>
                <option value="hod">Department Head (Dr. Gemechu)</option>
                <option value="gender">Gender Directorate (Sister Aster)</option>
                <option value="committee">ASDC Disciplinary Chair (Dr. Daniel)</option>
                <option value="president">University President (Prof. Bayisa)</option>
              </select>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.88rem;">
              <label class="checkbox-label" style="font-weight: 400; margin-bottom: 0;">
                <input type="checkbox" id="rememberMe" name="rememberMe"> Remember me
              </label>
              <a href="submission_guide.html">Need help?</a>
            </div>

            <button type="submit" class="btn" style="width: 100%; padding: 12px;">Login</button>
          </form>

          <div class="demo-accounts">
            <span style="font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Quick 1-Click Demo Login</span>
            <div class="demo-buttons" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px;">
              <button type="button" class="btn btn-secondary btn-sm" id="demoStudentBtn">👤 Student</button>
              <button type="button" class="btn btn-secondary btn-sm" id="demoTeacherBtn">👨‍🏫 Teacher</button>
              <button type="button" class="btn btn-secondary btn-sm" id="demoHodBtn">🏛️ Dept Head</button>
              <button type="button" class="btn btn-secondary btn-sm" id="demoGenderBtn">⚖️ Gender Director</button>
              <button type="button" class="btn btn-secondary btn-sm" id="demoCommitteeBtn">📜 ASDC Chair</button>
              <button type="button" class="btn btn-secondary btn-sm" id="demoPresidentBtn">🎓 President</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Ambo University Complaint Management System.</p>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm');
      const pwdInput = document.getElementById('password');
      const pwdToggle = document.getElementById('pwdToggle');
      const roleSelect = document.getElementById('userRole');
      const preRole = new URLSearchParams(window.location.search).get('role');
      if (preRole && roleSelect) roleSelect.value = preRole;

      const eyeOpenIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      const eyeOffIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

      pwdToggle.addEventListener('click', () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        pwdToggle.innerHTML = isPwd ? eyeOffIcon : eyeOpenIcon;
        pwdToggle.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
      });

      function doRoleLogin(roleKey) {
        window.AmboCMS.switchDemoRole(roleKey);
      }

      document.getElementById('demoStudentBtn').addEventListener('click', () => doRoleLogin('student'));
      document.getElementById('demoTeacherBtn').addEventListener('click', () => doRoleLogin('teacher'));
      document.getElementById('demoHodBtn').addEventListener('click', () => doRoleLogin('hod'));
      document.getElementById('demoGenderBtn').addEventListener('click', () => doRoleLogin('gender'));
      document.getElementById('demoCommitteeBtn').addEventListener('click', () => doRoleLogin('committee'));
      document.getElementById('demoPresidentBtn').addEventListener('click', () => doRoleLogin('president'));

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const role = document.getElementById('userRole').value;
        if (!role) {
          window.AmboCMS.showToast('Please select your statutory role.', 'warning');
          return;
        }
        doRoleLogin(role);
      });
    });
  </script>
</body>
</html>
