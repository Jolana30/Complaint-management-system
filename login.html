<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ambo CMS">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <title>Login - Ambo University CMS</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/nav.css">
  <style>
    .login-wrapper {
      max-width: 440px;
      margin: 40px auto;
    }
    .demo-accounts {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed var(--border-color);
      text-align: center;
    }
    .demo-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .demo-buttons button {
      flex: 1 1 120px;
      font-size: 0.82rem;
      padding: 8px 10px;
    }
    .pwd-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .pwd-toggle-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 6px;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="main-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        <img src="assets/images/logo.jpg" alt="Ambo University Logo">
        <div class="brand-info">
          <span class="brand-title">Ambo University</span>
          <span class="brand-subtitle">Complaint Management System</span>
        </div>
      </a>
      <ul class="nav-menu" id="navLinks"></ul>
      <div class="nav-actions">
        <button class="theme-toggle-btn" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="container">
      <div class="login-wrapper">
        <div class="card" style="padding: 36px 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
          <div style="text-align: center; margin-bottom: 26px;">
            <img src="assets/images/logo.jpg" alt="Ambo University" style="width: 68px; height: 68px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
            <h1 style="font-size: 1.45rem; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.015em;">Ambo University Portal</h1>
            <p style="color: var(--text-muted); font-size: 0.88rem;">Student-Faculty Complaint Management System</p>
          </div>

          <!-- Role Selector Tabs -->
          <div style="margin-bottom: 20px;">
            <label style="font-size: 0.84rem; margin-bottom: 8px;">Select Your Role</label>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;" id="roleSelectorGrid">
              <button type="button" class="btn btn-secondary btn-sm role-tab active" data-role="student" style="padding: 10px 4px; font-size: 0.78rem; font-weight: 700;">
                🎓 Student
              </button>
              <button type="button" class="btn btn-secondary btn-sm role-tab" data-role="teacher" style="padding: 10px 4px; font-size: 0.78rem; font-weight: 700;">
                👨‍🏫 Teacher
              </button>
              <button type="button" class="btn btn-secondary btn-sm role-tab" data-role="admin" style="padding: 10px 4px; font-size: 0.78rem; font-weight: 700;">
                🏛️ Admin
              </button>
              <button type="button" class="btn btn-secondary btn-sm role-tab" data-role="committee" style="padding: 10px 4px; font-size: 0.78rem; font-weight: 700;">
                ⚖️ Committee
              </button>
            </div>
          </div>

          <form id="loginForm">
            <input type="hidden" id="userRole" value="student">

            <div class="form-group">
              <label for="username" id="usernameLabel">Student ID or Username <span class="required">*</span></label>
              <input type="text" id="username" placeholder="e.g. ugr/12345/16 or abebe" required>
            </div>

            <div class="form-group">
              <label for="password">Password <span class="required">*</span></label>
              <div class="pwd-wrapper">
                <input type="password" id="password" placeholder="Enter password" required>
                <button type="button" class="pwd-toggle-btn" id="pwdToggle" aria-label="Show password">👁️</button>
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.86rem;">
              <label class="checkbox-label" style="font-weight: 400; margin-bottom: 0;">
                <input type="checkbox" id="rememberMe"> Remember me
              </label>
              <a href="submission_guide.html">Need help?</a>
            </div>

            <button type="submit" class="btn" style="width: 100%; padding: 12px; font-size: 0.95rem;">Sign In to Portal</button>
          </form>

          <!-- 1-Click Interactive Demo Switchers -->
          <div class="demo-accounts">
            <span style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">1-Click Demo Accounts</span>
            <div class="demo-buttons">
              <button type="button" class="btn btn-secondary btn-sm" id="demoStudentBtn">🎓 Abebe (Student)</button>
              <button type="button" class="btn btn-secondary btn-sm" id="demoTeacherBtn">👨‍🏫 Mr. Eyuel (Faculty)</button>
              <button type="button" class="btn btn-secondary btn-sm" id="demoAdminBtn">🏛️ Dr. Tadesse (Admin)</button>
              <button type="button" class="btn btn-secondary btn-sm" id="demoCommitteeBtn">⚖️ Dr. Daniel (Committee)</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Ambo University Complaint Management System.</p>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm');
      const pwdInput = document.getElementById('password');
      const pwdToggle = document.getElementById('pwdToggle');

      // Password toggle
      pwdToggle.addEventListener('click', () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        pwdToggle.textContent = isPwd ? '🙈' : '👁️';
      });

      // Role Tab Switcher
      const roleTabs = document.querySelectorAll('.role-tab');
      const userRoleInput = document.getElementById('userRole');
      const usernameLabel = document.getElementById('usernameLabel');
      const usernameInput = document.getElementById('username');

      roleTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          roleTabs.forEach(t => {
            t.classList.remove('btn-primary', 'active');
            t.classList.add('btn-secondary');
          });
          tab.classList.remove('btn-secondary');
          tab.classList.add('btn-primary', 'active');
          const role = tab.dataset.role;
          userRoleInput.value = role;

          if (role === 'student') {
            usernameLabel.innerHTML = 'Student ID or Username <span class="required">*</span>';
            usernameInput.placeholder = 'e.g. ugr/12345/16 or jdoe';
          } else if (role === 'teacher') {
            usernameLabel.innerHTML = 'Staff / Faculty ID <span class="required">*</span>';
            usernameInput.placeholder = 'e.g. fac/eyuel or eyuel@ambo.edu.et';
          } else if (role === 'committee') {
            usernameLabel.innerHTML = 'Committee Member ID <span class="required">*</span>';
            usernameInput.placeholder = 'e.g. com/daniel or daniel@ambo.edu.et';
          } else {
            usernameLabel.innerHTML = 'Administrator Username <span class="required">*</span>';
            usernameInput.placeholder = 'e.g. admin or tadesse@ambo.edu.et';
          }
        });
      });

      // Quick Demo Switchers
      document.getElementById('demoStudentBtn').addEventListener('click', () => {
        window.AmboCMS.setCurrentUser(window.AmboCMS.DEMO_USERS.student);
        window.AmboCMS.showToast('Logged in as Student Abebe Kebede', 'success');
        setTimeout(() => window.location.href = 'student_dashboard.html', 300);
      });

      document.getElementById('demoTeacherBtn').addEventListener('click', () => {
        window.AmboCMS.setCurrentUser(window.AmboCMS.DEMO_USERS.teacher);
        window.AmboCMS.showToast('Logged in as Teacher Mr. Eyuel', 'success');
        setTimeout(() => window.location.href = 'teacher_dashboard.html', 300);
      });

      document.getElementById('demoAdminBtn').addEventListener('click', () => {
        window.AmboCMS.setCurrentUser(window.AmboCMS.DEMO_USERS.admin);
        window.AmboCMS.showToast('Logged in as Administrator Dr. Tadesse', 'success');
        setTimeout(() => window.location.href = 'admin_dashboard.html', 300);
      });

      document.getElementById('demoCommitteeBtn').addEventListener('click', () => {
        window.AmboCMS.setCurrentUser(window.AmboCMS.DEMO_USERS.committee);
        window.AmboCMS.showToast('Logged in as Committee Chair Dr. Daniel', 'success');
        setTimeout(() => window.location.href = 'committee_dashboard.html', 300);
      });

      // Form Submit
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const role = document.getElementById('userRole').value;

        if (!role) {
          window.AmboCMS.showToast('Please select your role.', 'warning');
          return;
        }

        let name = username;
        if (role === 'student' && !name) name = 'Abebe Kebede';
        if (role === 'teacher' && !name) name = 'Mr. Eyuel';
        if (role === 'admin' && !name) name = 'Dr. Tadesse';
        if (role === 'committee' && !name) name = 'Dr. Daniel';

        window.AmboCMS.setCurrentUser({
          username: username,
          name: name,
          role: role,
          studentId: role === 'student' ? 'ugr/12345/16' : null,
          department: 'Information Technology'
        });

        window.AmboCMS.showToast(`Welcome back, ${name}!`, 'success');

        setTimeout(() => {
          if (role === 'student') window.location.href = 'student_dashboard.html';
          else if (role === 'teacher') window.location.href = 'teacher_dashboard.html';
          else if (role === 'admin') window.location.href = 'admin_dashboard.html';
          else if (role === 'committee') window.location.href = 'committee_dashboard.html';
        }, 300);
      });
    });
  </script>
</body>
</html>
