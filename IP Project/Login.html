<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambo university Student to Teacher complaint system</title>
    <link rel="stylesheet" href="Nav.css">
     <style>
      body{
  font-family: 'Inter', Arial, sans-serif;
  background-color: #F3F6FB;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  color: #111827;
}

.login-container{
    background: #FFFFFF;
    margin: 16px auto;
    padding: 20px;
    width: 360px;
    max-width: 520px;
  border: none;
  text-align: center;
  color:#0F172A;
  border-radius: 14px; 
  box-shadow: 0 20px 40px rgba(0,0,0,0.08);
}
  h1{
  margin-bottom:8px;
  font-weight: 700;
  font-size: 20px;
}
  p{
  margin-bottom: 18px;
  color: #6B7280;
  font-weight: 400; 
  font-size: 14px;
}

form{
  display: flex;
  flex-direction: column;
  text-align: left;
  font-weight: 500;
}
input{
  padding: 10px;
  margin-bottom: 12px;
  border: 1px solid #D1D5DB;
  border-radius: 10px;
  width: 100%;
  box-sizing: border-box;
  font-size: 14px;
  transition: 0.2s;
}

/* modern input-with-toggle layout */
.input-with-toggle {
  position: relative;
}
.input-with-toggle input {
  padding-right: 56px; /* room for the toggle */
}
.pwd-toggle {
  position: absolute !important;
  right: 8px !important;
  top: 50% !important;
  transform: translateY(-50%) !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: 40px !important;
  height: 36px !important;
  border-radius: 10px !important;
  background: rgba(37,99,235,0.06) !important;
  border: 1px solid rgba(37,99,235,0.12) !important;
  color: #2563EB !important;
  cursor: pointer !important;
}
.pwd-toggle svg { display: block }

/* align labels and spacing inside fieldset */
fieldset{ display: flex; flex-direction: column; gap: 12px; width: 100%; }
label { display: block; margin-bottom: 6px; }
input:hover{
  border-color: #2563EB;
}

select{
  padding: 10px;
  margin-bottom: 12px;
  border: 1px solid #D1D5DB;
  border-radius: 10px;
  width: 99%;
  font-size: 14px;
  transition: 0.2s;
  background: #FFFFFF;
  color: #111827;
}

select:hover{
  border-color: #2563EB;
}

.options{
  align-items: center;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 18px;
}
fieldset{
  border: none;
}
#cbox{ width: 15px; }

.options a:hover{
  text-decoration: underline;
}

button{
  padding: 12px;
  background: #2563EB;
  border: none;
  color: white;
  border-radius: 10px;
  cursor:pointer;
  font-weight: 600;
  transition: 0.25s;
}

button:hover {
  background: #1D4ED8;
}

button:active{
  transform: scale(0.98);
}

/* fallback logo size for small screens */
img{
  width: 88px;
  height: 88px;
  margin-bottom: 12px;
  object-fit: cover;
  border-radius: 12px;
  border: 3px solid rgba(37,99,235,0.12);
  box-shadow: 0 8px 20px rgba(2,6,23,0.08);
  background: #fff;
}

/* Ensure password toggle added by shared.js doesn't break layout */
.login-container .pwd-toggle {
  right: 10px !important;
  top: 50% !important;
  transform: translateY(-50%) !important;
  position: absolute !important;
  background: transparent !important;
  border: none !important;
}

.login-container .pwd-toggle .eye { font-size: 14px }

.Footer{
  color: #6B7280;
  text-align: center;
  padding: 20px 10px;
  border-top: 1px solid #E5E7EB;
  margin-top: 30px;
  font-size: 12px;

}

#name{
  font-size: 1rem;
  margin-bottom: 6px;
  font-weight: 600;
  color: #1F2937;
  letter-spacing: 1px;
  margin-bottom: 6px;
}

#motto{
  font-size: 0.9rem;
  margin: 0;
  margin-bottom: 6px;
}

#adress{
  font-size: 0.85rem;
  margin: 0;
  margin-bottom: 6px;
}

@media (max-width: 480px) {
  .login-container{
    width: calc(100% - 24px);
    padding: 18px;
  }

  h1{
    font-size: 20px;
  }
}

/* Desktop / wide screens */
@media (min-width: 769px) {
  .login-container{
    padding: 34px 40px;
    max-width: 540px;
  }

  h1{ font-size: 26px; }
  p{ font-size: 15px }
  img{ width: 96px; height: 96px }
  button{ padding: 14px 18px }
}
     </style>
  </head>
<body>
    <div class="login-container">
      <img src="Pictures/download (1).jpg" alt="Ambo university logo">
      <h1>Ambo university</h1>
    <p>Student to Teacher complaint system</p>
    <form id="loginForm" action="#" method="get">
      <fieldset>
        <label for="Username">Username:</label>
        <input id="username" type="text" placeholder="Enter your username" required>
        <label for="password">Password:</label>
        <input id="password" type="password" placeholder="Enter your password" required>
        <label for="user-role">Login as:</label>
        <select id="user-role" name="role" required>
          <option value="" disabled selected>Select your role</option>
          <option value="teacher">Teacher</option>
          <option value="student">Student</option>
          <option value="admin">Admin</option>
        </select>
      </fieldset>
      <div class="options">
      <label>
        <input type="checkbox" id="cbox">Remember Me
      </label>
      <a href="#">Forgot Password?</a>
      </div>
      <button  type="submit">Login</button>
    </form>
    <div class="Footer">
<p id="name"> Ambo University </p>
<p id="motto">Better future through Knowledge and Wisdom!</p>
<p id="adress">P.O. Box 19, Ambo, Oromia, Ethiopia
   Phone: (+251) 111 236 3160</p>
  </div>
    </div>
    <script>
      // Handle login: store selected role and redirect to correct dashboard
      (function(){
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function(e){
          e.preventDefault();
          const roleSelect = document.getElementById('user-role');
          const role = roleSelect.value;
          const usernameEl = document.getElementById('username');
          const username = usernameEl ? usernameEl.value.trim() : '';
          if(!role) return alert('Please select a role');
          localStorage.setItem('userRole', role);
          if(username) localStorage.setItem('username', username);
          if(role === 'student') window.location.href = 'Student_Dashboard.html';
          else if(role === 'teacher') window.location.href = 'Teacher_Dashboard.html';
          else if(role === 'admin') window.location.href = 'Admin_Dashboard1.html';
          else window.location.href = 'Home.html';
        });
      })();
    </script>
    <script src="shared.js" defer></script>
</body>
</html>
