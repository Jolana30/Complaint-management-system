<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambo university Student to Teacher complaint system</title>
     <style>
      body{
  font-family: 'Inter', Arial, sans-serif;
  background-color: #F3F6FB;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  color: #111827;
}
select{
  padding: 10px;
  margin-bottom: 12px;
  border: 1px solid #D1D5DB;
  border-radius: 10px;
  width: 99%;
  font-size: 14px;
  transition: 0.2s;
  background: #FFFFFF;
  color: #111827;
}

select:hover{
  border-color: #2563EB;
}

.login-container{
  background: #FFFFFF;
  margin: 10px;
  padding: 30px;
  width: 320px;
  border: none;
  text-align: center;
  color:#0F172A;
  border-radius: 14px; 
  box-shadow: 0 20px 40px rgba(0,0,0,0.08);
}
h1{
  margin-bottom:5px;
  font-weight: 600;
}
p{
  margin-bottom: 20px;
  color: #6B7280;
  font-weight: 400; 
  font-size: 14px;
}

form{
  display: flex;
  flex-direction: column;
  text-align: left;
  font-weight: 500;
}

label{
  display: block;
  margin-bottom: 8px;
  color: #334155;
  font-size: 14px;
}

input,
select{
  padding: 10px 12px;
  border: 1px solid #D1D5DB;
  border-radius: 10px;
  width: 100%;
  box-sizing: border-box;
  font-size: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
  background: #ffffff;
  color: #0F172A;
}

input,
select{
  margin-bottom: 14px;
}

input:hover,
select:hover{
  border-color: #2563EB;
}

.options{
  align-items: center;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
fieldset{
  border: none;
}
#cbox{
  width: 15px;
}

.options a{
  text-decoration: none;
  color: #2563EB;
}

.options a:hover{
  text-decoration: underline;
}

button{
  padding: 12px;
  background: #2563EB;
  border: none;
  color: white;
  border-radius: 10px;
  cursor:pointer;
  font-weight: 600;
  transition: 0.25s;
}

button:hover {
  background: #1D4ED8;
}

button:active{
  transform: scale(0.98);
}

img{
  width: 80px;
  height: 80px;
  margin-bottom: 10px;
}

.Footer{
  color: #6B7280;
  text-align: center;
  padding: 20px 10px;
  border-top: 1px solid #E5E7EB;
  margin-top: 30px;
  font-size: 12px;

}

#name{
  font-size: 1rem;
  margin-bottom: 6px;
  font-weight: 600;
  color: #1F2937;
  letter-spacing: 1px;
  margin-bottom: 6px;
}

#motto{
  font-size: 0.9rem;
  margin: 0;
  margin-bottom: 6px;
}

#adress{
  font-size: 0.85rem;
  margin: 0;
  margin-bottom: 6px;
}

@media (max-width: 480px) {
  .login-container{
    width: calc(100% - 24px);
    padding: 20px;
  }

  h1{
    font-size: 24px;
  }
}
     </style>
  </head>
<body>
    <div class="login-container">
      <img src="ip-project/Pictures/download (1).jpg" alt="Ambo university logo">
      <h1>Ambo university</h1>
    <p>Student to Teacher complaint system</p>
    <form id="loginForm" action="#" method="get">
      <fieldset>
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Enter your username" required>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password" required>
        <label for="user-role">Login as:</label>
        <select id="user-role" name="role" required>
          <option value="" disabled selected>Select your role</option>
          <option value="teacher">Teacher</option>
          <option value="student">Student</option>
          <option value="admin">Admin</option>
        </select>
      </fieldset>
      <div class="options">
      <label>
        <input type="checkbox" id="cbox">Remember Me
      </label>
      <a href="#">Forgot Password?</a>
      </div>
      <button type="submit">Login</button>
    </form>
    <div class="Footer">
<p id="name"> Ambo University </p>
<p id="motto">Better future through Knowledge and Wisdom!</p>
<p id="adress">P.O. Box 19, Ambo, Oromia, Ethiopia
   Phone: (+251) 111 236 3160</p>
  </div>
    </div>
    <script>
      // Handle login: store selected role and redirect to the correct dashboard.
      // The app is deployed through Vercel with index.html at the project root
      // and the role-specific pages inside the ip-project folder.
      (function(){
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function(e){
          e.preventDefault();
          const roleSelect = document.getElementById('user-role');
          const role = roleSelect.value;
          const usernameEl = document.getElementById('username');
          const username = usernameEl ? usernameEl.value.trim() : '';
          if(!role) return alert('Please select a role');
          localStorage.setItem('userRole', role);
          if(username) localStorage.setItem('username', username);
          if(role === 'student') window.location.href = 'ip-project/Student_Dashboard.html';
          else if(role === 'teacher') window.location.href = 'ip-project/Teacher_Dashboard.html';
          else if(role === 'admin') window.location.href = 'ip-project/Admin_Dashboard1.html';
          else window.location.href = 'index.html';
        });
      })();
    </script>
</body>
</html>
